<h3>Alterar Aparelho</h3>
<div mat-dialog-content>
    <form [formGroup]="form" >
        <div class="row">
            <div class="col">
                <mat-form-field appearance="outline">
                    <mat-label>Aparelho</mat-label>
                    <mat-select formControlName="equipamentId">
                        <mat-option *ngFor="let item of equipamentResult" [value]="item.id">{{item.name}}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </div>
    </form>
</div>
<div mat-dialog-actions>
    <button mat-raised-button color="warn" (click)="onNoClick()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="onSubmit()">Salvar</button>
</div>
